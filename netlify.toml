# Netlify-configuratie voor de statische pagina "Deadlines bij de documenten".
# Eén statische pagina in de hoofdmap — niets te builden.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
